name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install pytest pyflakes
      - name: Lint (undefined names, unused imports)
        run: python -m pyflakes voice_typer tests
      - name: Unit tests
        run: python -m pytest -q
